stages:
  - deploy

deploy_develop:
  stage: deploy
  tags:
    - docker-deploy
  resource_group: development
  environment:
    name: development
  before_script:
    - test -s "$SSH_PRIVATE_KEY"
    - test -s "$SSH_KNOWN_HOSTS"
    - command -v ssh
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - |
      ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
        "$DEV_USER@$DEV_HOST" \
        bash -s -- "$DEV_DEPLOY_PATH" "$CI_COMMIT_SHA" <<'REMOTE_SCRIPT'
      set -eu

      deploy_path="$1"
      commit_sha="$2"

      test -d "$deploy_path/.git"
      cd "$deploy_path"

      # The checkout on the development VM must have origin pointing at this GitLab project.
      git fetch --depth 1 origin "$commit_sha"
      git checkout --detach "$commit_sha"

      # Environment-specific values stay in the VM's untracked .env file.
      docker compose config --quiet
      docker compose up -d --build --remove-orphans

      for _ in $(seq 1 30); do
        status="$(docker inspect knowledge-hub-backend --format '{{.State.Health.Status}}' 2>/dev/null || true)"
        if [ "$status" = healthy ]; then
          break
        fi
        sleep 2
      done

      test "$status" = healthy
      docker compose ps
      docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      docker compose exec -T frontend wget -q -O /dev/null http://127.0.0.1/
      REMOTE_SCRIPT
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
