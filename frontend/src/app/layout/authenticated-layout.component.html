<div class="app-shell" [class.app-shell--menu-open]="menuOpen">
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <header class="topbar">
    <button #menuButton class="menu-button" type="button" (click)="menuOpen = !menuOpen"
      [attr.aria-expanded]="menuOpen" aria-controls="primary-navigation" aria-label="Abrir navegação">
      <span aria-hidden="true">☰</span>
    </button>
    <a class="brand" routerLink="/inicio"><span class="brand__mark" aria-hidden="true">K</span><span>Knowledge Hub</span></a>
    <button class="theme-button" type="button" (click)="theme.toggle()" [attr.aria-pressed]="theme.current() === 'dark'" [attr.aria-label]="theme.current() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'">
      <span aria-hidden="true">{{ theme.current() === "dark" ? "☀" : "☾" }}</span>
      <span>{{ theme.current() === "dark" ? "Tema claro" : "Tema escuro" }}</span>
    </button>
    <button class="logout-button" type="button" (click)="logout()">Desconectar</button>
  </header>

  @if (menuOpen) {
    <button class="backdrop" type="button" aria-label="Fechar navegação" (click)="closeMenu(true)"></button>
  }

  <nav id="primary-navigation" class="sidebar" aria-label="Navegação principal">
    <p class="sidebar__label">Área de trabalho</p>
    <a routerLink="/inicio" routerLinkActive="is-active" #homeLink="routerLinkActive" [attr.aria-current]="homeLink.isActive ? 'page' : null" (click)="closeMenu()">Início</a>
    <a routerLink="/busca" routerLinkActive="is-active" #searchLink="routerLinkActive" [attr.aria-current]="searchLink.isActive ? 'page' : null" (click)="closeMenu()">Busca inteligente</a>
    <a routerLink="/perguntar" routerLinkActive="is-active" #askLink="routerLinkActive" [attr.aria-current]="askLink.isActive ? 'page' : null" (click)="closeMenu()">Pergunte à base</a>
    <p class="sidebar__label">Acervo</p>
    <a routerLink="/ingestao" routerLinkActive="is-active" #ingestionLink="routerLinkActive" [attr.aria-current]="ingestionLink.isActive ? 'page' : null" (click)="closeMenu()">Ingestão</a>
    <a routerLink="/biblioteca" routerLinkActive="is-active" #libraryLink="routerLinkActive" [attr.aria-current]="libraryLink.isActive ? 'page' : null" (click)="closeMenu()">Biblioteca</a>
    <a routerLink="/organizacao" routerLinkActive="is-active" #organizationLink="routerLinkActive" [attr.aria-current]="organizationLink.isActive ? 'page' : null" (click)="closeMenu()">Organização</a>
  </nav>

  <main id="main-content" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
